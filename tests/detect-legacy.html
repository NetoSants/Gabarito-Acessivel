<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste do detector — layout oficial (Novo_gabarito.pdf)</title>
<style>
  body { font: 14px/1.45 system-ui, "Segoe UI", sans-serif; margin: 16px; color: #14243a; }
  canvas { max-width: 100%; border: 1px solid #bbb; background: #fff; }
  .ok { color: #12633a; font-weight: 700; }
  .bad { color: #9b1c1c; font-weight: 700; }
  pre { background: #f6f8fa; padding: 10px; overflow: auto; border-radius: 6px; }
</style>
</head>
<body>
<h1>Detector OMR — layout oficial (Novo_gabarito.pdf)</h1>
<p id="src-info">…</p>
<canvas id="cv"></canvas>
<h2 id="verdict">…</h2>
<pre id="out"></pre>

<script src="../js/utils.js"></script>
<script src="../src/core/template.js"></script>
<script src="../src/core/template-legacy.js"></script>
<script src="../js/detector.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var src = params.get('src');
  var report = params.get('report') !== '0';
  var CYCLE = 'ABCDE';

  var tpl = window.OMR.buildLegacyTemplate();
  var matrix = window.OMR.exportMatrix(tpl);

  function expected(q) { return CYCLE[(q - 1) % CYCLE.length]; }

  function post(name, body) {
    if (!report) return;
    fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: body });
  }

  var img = new Image();
  img.onload = function () {
    document.getElementById('src-info').textContent = src + ' — ' + img.naturalWidth + '×' + img.naturalHeight + ' px';
    var cv = document.getElementById('cv');
    cv.width = img.naturalWidth;
    cv.height = img.naturalHeight;
    var ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0);

    var res = window.OMR.detect(cv, matrix);
    var verdict = document.getElementById('verdict');
    var out = document.getElementById('out');

    if (!res.ok) {
      verdict.className = 'bad';
      verdict.textContent = 'FALHOU: ' + res.reason;
      out.textContent = JSON.stringify(res, null, 2);
      post('legacy_result.json', JSON.stringify(res, null, 2));
      window.__DONE__ = 'fail';
      return;
    }

    ctx.lineWidth = 2;
    res.bubbles.forEach(function (b) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, Math.max(4, b.r), 0, Math.PI * 2);
      ctx.strokeStyle = b.marked ? '#e11' : 'rgba(0,150,0,.45)';
      ctx.stroke();
    });

    var mismatch = [];
    res.answers.forEach(function (a) {
      if (a.value !== expected(a.q)) mismatch.push({ q: a.q, got: a.value, expected: expected(a.q) });
    });

    var summary = {
      mode: res.mode,
      ppm: Math.round(res.ppm * 100) / 100,
      grayThreshold: res.grayThreshold,
      answered: res.answers.filter(function (a) { return a.value; }).length,
      anuladas: res.answers.filter(function (a) { return a.value === 'X'; }).length,
      mismatch: mismatch
    };

    verdict.className = mismatch.length ? 'bad' : 'ok';
    verdict.textContent = mismatch.length
      ? (mismatch.length + ' divergência(s) do padrão A-B-C-D-E')
      : 'OK — 52/52 seguem o padrão A-B-C-D-E';

    out.textContent = JSON.stringify({
      summary: summary,
      answers: res.answers.map(function (a) { return ('0' + a.q).slice(-2) + '=' + (a.value || '-'); }).join(' ')
    }, null, 2);

    post('legacy_result.json', JSON.stringify(summary));
    post('legacy_answers.txt', res.answers.map(function (a) { return a.q + ',' + a.value; }).join('\n'));
    post('legacy_overlay.b64', cv.toDataURL('image/png').split(',')[1]);
    window.__DONE__ = 'ok';
  };

  img.onerror = function () {
    document.getElementById('verdict').className = 'bad';
    document.getElementById('verdict').textContent = 'imagem não carregou: ' + src;
    window.__DONE__ = 'fail';
  };

  img.src = src;
})();
</script>
</body>
</html>
